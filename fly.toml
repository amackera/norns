app = 'norns-runtime'
primary_region = 'yyz'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'cloud.nornscode.com'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
